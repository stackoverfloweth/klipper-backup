[gcode_macro START_PRINT]
description: Heat, home, and trigger bed mesh calibration
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    {% if BED_TEMP > 0 %}
        M140 S{BED_TEMP}
    {% endif %}

    {% if EXTRUDER_TEMP > 0 %}
        M104 S150
    {% endif %}

    G28
    BED_MESH_CALIBRATE PRINT_MIN={params.PRINT_MIN} PRINT_MAX={params.PRINT_MAX}

    {% if BED_TEMP > 0 %}
        M190 S{BED_TEMP}
    {% endif %}

    {% if EXTRUDER_TEMP > 0 %}
        M109 S{EXTRUDER_TEMP}
    {% endif %}

[gcode_macro PRINT_START]
description: OrcaSlicer-compatible alias for START_PRINT
gcode:
    START_PRINT {rawparams}

[gcode_macro PRINT_END]
description: Finish print safely
gcode:
    G91
    G1 E-1.0 F1800
    G1 Z10 F600
    G90
    G1 X10 Y210 F6000
    TURN_OFF_HEATERS

[gcode_macro UNLOAD_FILAMENT]
description: Heat nozzle and retract filament for removal
gcode:
    {% set TEMP = params.TEMP|default(210)|int %}
    M109 S{TEMP}
    M83
    G1 E10 F300
    G1 E-80 F1800
    G92 E0
    RESPOND TYPE=command MSG="Filament unloaded. Hold the extruder release lever and remove filament."

[gcode_macro LOAD_FILAMENT]
description: Heat nozzle and load/purge filament
gcode:
    {% set TEMP = params.TEMP|default(210)|int %}
    M109 S{TEMP}
    M83
    G1 E50 F300
    G92 E0
    RESPOND TYPE=command MSG="Filament loaded. Purge until the new material/color exits cleanly."

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    {% set Z = params.Z|default(15)|float %}
    {% set E = params.E|default(1.0)|float %}

    SAVE_GCODE_STATE NAME=PAUSE_STATE
    PAUSE_BASE
    SET_IDLE_TIMEOUT TIMEOUT=3600
    G91
    G1 E-{E} F1800
    G1 Z{Z} F600
    G90
    G1 X210 Y10 F6000

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=100
    SET_IDLE_TIMEOUT TIMEOUT=3600
    RESUME_BASE


