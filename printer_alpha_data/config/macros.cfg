[gcode_macro START_PRINT]
description: Heat, home, and trigger bed mesh calibration
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    {% if BED_TEMP > 0 %}
        M140 S{BED_TEMP}
    {% endif %}

    {% if EXTRUDER_TEMP > 0 %}
        M104 S150
    {% endif %}

    G28
    BED_MESH_CALIBRATE PRINT_MIN={params.PRINT_MIN} PRINT_MAX={params.PRINT_MAX}

    {% if BED_TEMP > 0 %}
        M190 S{BED_TEMP}
    {% endif %}

    {% if EXTRUDER_TEMP > 0 %}
        M109 S{EXTRUDER_TEMP}
    {% endif %}

[gcode_macro PRINT_START]
description: OrcaSlicer-compatible alias for START_PRINT
gcode:
    START_PRINT {rawparams}

[gcode_macro PRINT_END]
description: Finish print safely
gcode:
    G91
    G1 E-1.0 F1800
    G1 Z10 F600
    G90
    G1 X10 Y210 F6000
    TURN_OFF_HEATERS

[gcode_macro UNLOAD_FILAMENT]
description: Heat nozzle and retract filament for removal
gcode:
    {% set TEMP = params.TEMP|default(210)|int %}
    M109 S{TEMP}
    M83
    G1 E10 F300
    G1 E-80 F1800
    G92 E0
    RESPOND TYPE=command MSG="Filament unloaded. Hold the extruder release lever and remove filament."

[gcode_macro LOAD_FILAMENT]
description: Heat nozzle and load/purge filament
gcode:
    {% set TEMP = params.TEMP|default(210)|int %}
    M109 S{TEMP}
    M83
    G1 E50 F300
    G92 E0
    RESPOND TYPE=command MSG="Filament loaded. Purge until the new material/color exits cleanly."

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    {% set Z = params.Z|default(15)|float %}
    {% set E = params.E|default(1.0)|float %}

    SAVE_GCODE_STATE NAME=PAUSE_STATE
    PAUSE_BASE
    SET_IDLE_TIMEOUT TIMEOUT=3600
    G91
    G1 E-{E} F1800
    G1 Z{Z} F600
    G90
    G1 X210 Y10 F6000

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=100
    SET_IDLE_TIMEOUT TIMEOUT=3600
    RESUME_BASE

[gcode_macro Z_INDEX_CHECK]
description: Home, optionally heat bed, optionally re-probe, then move to center for Z offset check
variable_probe_temp: 60
variable_nozzle_temp: 150
variable_x_center: 110
variable_y_center: 110
gcode:
  {% set bed_temp = params.BED|default(printer["gcode_macro Z_INDEX_CHECK"].probe_temp)|int %}
  {% set nozzle_temp = params.NOZZLE|default(printer["gcode_macro Z_INDEX_CHECK"].nozzle_temp)|int %}
  {% set reprobe = params.REPROBE|default(1)|int %}
  {% set x = params.X|default(printer["gcode_macro Z_INDEX_CHECK"].x_center)|float %}
  {% set y = params.Y|default(printer["gcode_macro Z_INDEX_CHECK"].y_center)|float %}

  M117 Z check prep
  RESPOND MSG="Z check: BED={bed_temp}, NOZZLE={nozzle_temp}, REPROBE={reprobe}"

  SAVE_GCODE_STATE NAME=Z_INDEX_CHECK_STATE
  G90

  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

  M140 S{bed_temp}
  M104 S{nozzle_temp}
  M190 S{bed_temp}
  M109 S{nozzle_temp}

  {% if reprobe == 1 %}
    RESPOND MSG="Re-probing at temperature..."
    G28 Z
    {% if printer.configfile.settings.bed_mesh is defined %}
      BED_MESH_CLEAR
      BED_MESH_CALIBRATE
    {% endif %}
  {% endif %}

  G1 Z10 F3000
  G1 X{x} Y{y} F9000
  G1 Z5 F1500

  RESPOND MSG="Use TESTZ Z=-0.1 / Z=-0.02 / Z=0.02, then ACCEPT or ABORT"
  M117 Ready for TESTZ


